<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Share Card — Rezalian Vatiady</title>
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0a0c12;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e2e8f0;overflow:hidden;position:relative}
.accent{position:absolute;top:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#3b82f6 63%,#06b6d4 63%)}
.glow1{position:absolute;top:-160px;left:-120px;width:480px;height:480px;border-radius:50%;background:rgba(59,130,246,.13);filter:blur(110px)}
.glow2{position:absolute;bottom:-180px;right:-100px;width:520px;height:520px;border-radius:50%;background:rgba(6,182,212,.10);filter:blur(120px)}
.wrap{position:absolute;inset:0;padding:70px 76px;display:flex;align-items:center;gap:56px}
.left{flex:1}
.badge{display:inline-flex;align-items:center;gap:10px;padding:9px 20px;border-radius:999px;border:1px solid rgba(6,182,212,.35);background:rgba(6,182,212,.08);font-family:'Consolas',monospace;font-size:21px;letter-spacing:2px;color:#06b6d4;font-weight:600}
.name{font-size:84px;font-weight:800;letter-spacing:-2px;line-height:1.04;margin:26px 0 18px;color:#f8fafc}
.name .grad{background:linear-gradient(90deg,#3b82f6,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:29px;color:#94a3b8;line-height:1.45;max-width:660px}
.role b{color:#e2e8f0}
.metrics{display:flex;gap:34px;margin-top:38px;font-family:'Consolas',monospace;font-size:21px;color:#8fa3bf}
.metrics b{color:#f8fafc;font-size:26px;display:block;margin-bottom:2px}
.pframe{flex:0 0 400px;height:400px;border-radius:50%;border:5px solid #1e2d45;box-shadow:0 30px 80px rgba(59,130,246,.25),0 0 0 14px rgba(59,130,246,.07);overflow:hidden;background:#111a2e}
.pframe img{width:100%;height:100%;object-fit:cover}
.corner{position:absolute;bottom:34px;left:76px;right:76px;display:flex;justify-content:space-between;align-items:center;font-family:'Consolas',monospace;font-size:19px;color:#8fa3bf}
.corner .b{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,#3b82f6,#06b6d4)}
</style>
</head>
<body>
<div class="accent"></div>
<div class="glow1"></div>
<div class="glow2"></div>
<div class="wrap">
  <div class="left">
    <span class="badge">BI · DATA · AI</span>
    <div class="name">Rezalian<br/><span class="grad">Vatiady</span></div>
    <div class="role"><b>Business Intelligence</b> · <b>Python Automation</b> · <b>AI Workflow Architect</b><br/>Ex-IKEA Regional BI · Founder, Zalin Labs</div>
    <div class="metrics">
      <span><b>13</b> CASE-STUDY DECKS</span>
      <span><b>24</b> ARTICLES</span>
      <span><b>30+</b> PRODUCTION APPS</span>
    </div>
  </div>
  <div class="pframe"><img src="reza-photo.png" alt=""></div>
</div>
<div class="corner">
  <span class="b"><span class="dot"></span> rezalianvatiady.github.io</span>
  <span>ZALIN LABS</span>
</div>
</body>
</html>
